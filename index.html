    <meta property="og:url" content="https://hovepaintingcontractors.com/" />
    <meta property="og:image" content="https://hovepaintingcontractors.com/projects/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hove Painting Contractors | Brighton & Hove Painters & Decorators" />
    <meta name="twitter:description" content="Professional painting and decorating services across Brighton, Hove and Sussex." />
    <meta name="twitter:image" content="https://hovepaintingcontractors.com/projects/logo.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "PaintingContractor",
        "name": "Hove Painting Contractors",
        "url": "https://hovepaintingcontractors.com/",
        "logo": "https://hovepaintingcontractors.com/projects/logo.png",
        "telephone": "+44 7802 400396",
        "email": "hovecontracting@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Brighton",
          "addressRegion": "Sussex",
          "addressCountry": "GB"
        },
        "areaServed": ["Brighton", "Hove", "Sussex"],
        "sameAs": ["https://github.com/hovecontracting/Hove-contracting-landing-page"]
      }
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Bot to detect -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="contact" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
